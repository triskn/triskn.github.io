<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#23392e">
  <meta name="description" content="Explore a storybook village in real-time 3D. Follow the stream, cross the bridges, and wander the hillside trails of Windward Valley.">
  <link rel="icon" type="image/png" href="/sprout.png">
  <title>Windward Tales</title>
  <script type="module" crossorigin src="/assets/index-BzBqjNjK.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/three-math-DO9PD7nb.js">
  <link rel="modulepreload" crossorigin href="/assets/three-renderer-Cqi4EVhY.js">
  <link rel="stylesheet" crossorigin href="/assets/index-Dcyhk5Qj.css">
</head>
<body>
  <main id="experience" aria-label="Windward Tales, a 3D village">
    <div id="world" aria-label="Interactive 3D scene"></div>
    <div class="veil" aria-hidden="true"></div>
    <header class="hero">
      <div class="edition"><span class="edition-line"></span> WINDWARD VALLEY</div>
      <h1>Windward <span>Tales</span></h1>
      <p>Follow the stream. The wind will lead you home.</p>
    </header>
    <section class="time-panel" aria-label="Time of day">
      <div class="time-label"><span id="timeLight"></span><span id="timeName">Noon · 12:00</span></div>
      <div id="timeButtons" class="time-buttons" role="group" aria-label="Change the time of day"></div>
    </section>
    <div class="visit" id="visit" hidden aria-live="polite">
      <div id="visitTitle"></div><p id="visitText"></p>
    </div>
    <div class="mobile-walk" id="mobileWalk" aria-label="Movement controls">
      <button data-key="KeyW" aria-label="Move forward">↑</button><button data-key="KeyA" aria-label="Move left">←</button>
      <button data-key="KeyS" aria-label="Move backward">↓</button><button data-key="KeyD" aria-label="Move right">→</button>
    </div>
    <footer class="hud">
      <div class="controls-hint">
        <span><kbd>Left drag</kbd> Orbit</span><span><kbd>Right drag</kbd> Pan</span><span><kbd>Scroll</kbd> Zoom</span><span><kbd>W A S D</kbd> Move</span>
      </div>
      <div class="transport">
        <button id="free" class="mode active" type="button" aria-pressed="true"><i data-icon="compass"></i>Free Explore</button>
        <button id="film" class="mode" type="button" aria-pressed="false"><i data-icon="play"></i><span id="filmLabel">Cinematic Tour</span></button>
      </div>
      <div class="tools">
        <button class="tool-button" id="overview" type="button" title="Return to overview" aria-label="Return to overview"><i data-icon="home"></i></button>
        <button class="tool-button" id="mapToggle" type="button" title="Village Map" aria-label="Village Map" aria-expanded="false"><i data-icon="map"></i></button>
        <button class="tool-button" id="fullscreen" type="button" title="Fullscreen" aria-label="Fullscreen"><i data-icon="expand"></i></button>
      </div>
    </footer>
    <aside id="map" aria-label="Village Map" hidden>
      <div class="map-head"><div><small>WINDWARD VALLEY</small><h2>Village Map</h2></div><button id="mapClose" aria-label="Close map">×</button></div>
      <div id="mapDrawing" class="map-drawing"></div>
      <div id="mapPlaces" class="map-places"></div>
    </aside>
    <div id="progress" hidden><span></span></div>
    <div id="loading"><div class="loading-mark"></div><strong>Windward Tales</strong><p>The valley is waking up.</p></div>
  </main>
</body>
</html>
